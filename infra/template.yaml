AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  API Gateway (HTTP API, stage prod) enrutando hacia los 4 microservicios en contenedor
  (Fase 2), con despliegue progresivo Canary y rollback automático (Fase 4, Opción A). Las
  imágenes ya están publicadas en ECR por services/build-and-push.sh; este template NO
  construye las imágenes, solo las referencia.

Parameters:
  IntakeTriageImageUri:
    Type: String
    Description: URI de la imagen ECR de intake-triage (tag inmutable, no ":latest")
  DispatchImageUri:
    Type: String
  GeospatialImageUri:
    Type: String
  NotificationImageUri:
    Type: String
  IntakeTriageRoleArn:
    Type: String
    Description: ARN del rol IAM de mínimo privilegio (infra/iam/intake-triage-policy.json)
  DispatchRoleArn:
    Type: String
  GeospatialRoleArn:
    Type: String
  NotificationRoleArn:
    Type: String
  CorsOrigin:
    Type: String
    Description: Dominio de Vercel autorizado por CORS (ej. https://emergencias.vercel.app)
  ThrottlingRateLimit:
    Type: Number
    Default: 50
    Description: Solicitudes por segundo permitidas en estado estable (throttling del stage)
  ThrottlingBurstLimit:
    Type: Number
    Default: 100
    Description: Ráfaga máxima permitida antes de empezar a devolver 429
  RateLimitPorIpCada5Min:
    Type: Number
    Default: 300
    Description: Límite de requests por IP en una ventana de 5 min (regla WAF), mínimo 100
  LatencyThresholdMs:
    Type: Number
    Default: 1500
    Description: Umbral de latencia (p99, ms) para intake-triage/dispatch/notification. Geospatial usa uno propio más alto (ver comentario).
  ChaosErrorRatePercent:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 100
    Description: >
      % de invocaciones que devuelven un error 500 sintético a propósito (services/_shared/chaos.ts).
      0 en operación normal. Subirlo (ej. 50) y hacer `sam deploy` es el mecanismo para DEMOSTRAR
      el rollback automático del Canary: dispara las alarmas durante la ventana del 10% de tráfico
      y CodeDeploy revierte solo a la versión anterior (rate=0), sin intervención manual.

Globals:
  Function:
    Timeout: 25
    MemorySize: 256
    Environment:
      Variables:
        CORS_ORIGIN: !Ref CorsOrigin
        CHAOS_ERROR_RATE: !Ref ChaosErrorRatePercent

Resources:
  # -----------------------------------------------------------------------
  # API Gateway HTTP API — punto único de entrada, stage "prod" formal.
  # -----------------------------------------------------------------------
  EmergenciasApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins: [!Ref CorsOrigin]
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit

  # -----------------------------------------------------------------------
  # Service 1: Intake & Triage
  # AutoPublishAlias + DeploymentPreference (Fase 4, Opción A): cada `sam
  # deploy` publica una versión nueva de la función, pero el alias "prod"
  # (al que apunta API Gateway) solo le manda el 10% del tráfico durante 5
  # minutos. Si alguna de las 3 alarmas se activa en esa ventana, CodeDeploy
  # revierte el 100% del tráfico a la versión anterior automáticamente.
  # -----------------------------------------------------------------------
  IntakeTriageFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: emergencias-intake-triage
      ImageUri: !Ref IntakeTriageImageUri
      Role: !Ref IntakeTriageRoleArn
      AutoPublishAlias: prod
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref IntakeTriageErrorsAlarm
          - !Ref IntakeTriageLatencyAlarm
      Events:
        CrearSolicitud:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergenciasApi
            Path: /v1/emergencias
            Method: POST
        ListarPorCiudad:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergenciasApi
            Path: /v1/emergencias/zona/{ciudad}
            Method: GET

  IntakeTriageErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergencias-intake-triage-errors
      AlarmDescription: Errores de Lambda (Service 1) — dispara rollback del canary.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IntakeTriageFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  IntakeTriageLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergencias-intake-triage-latency
      AlarmDescription: Latencia p99 (Service 1) sobre el umbral — dispara rollback del canary.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref IntakeTriageFunction
      ExtendedStatistic: p99
      Period: 60
      EvaluationPeriods: 2
      Threshold: !Ref LatencyThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # -----------------------------------------------------------------------
  # Service 2: Dispatch & Resource Assignment
  # -----------------------------------------------------------------------
  DispatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: emergencias-dispatch
      ImageUri: !Ref DispatchImageUri
      Role: !Ref DispatchRoleArn
      AutoPublishAlias: prod
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref DispatchErrorsAlarm
          - !Ref DispatchLatencyAlarm
      Events:
        CrearDespacho:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergenciasApi
            Path: /v1/despachos
            Method: POST
        ActualizarDespacho:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergenciasApi
            Path: /v1/despachos/{id}
            Method: PATCH

  DispatchErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergencias-dispatch-errors
      AlarmDescription: Errores de Lambda (Service 2) — dispara rollback del canary.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DispatchFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DispatchLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergencias-dispatch-latency
      AlarmDescription: Latencia p99 (Service 2) sobre el umbral — dispara rollback del canary.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref DispatchFunction
      ExtendedStatistic: p99
      Period: 60
      EvaluationPeriods: 2
      Threshold: !Ref LatencyThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # -----------------------------------------------------------------------
  # Service 3: Geospatial & Zone Aggregation
  # Latencia con umbral propio (5000ms, no el LatencyThresholdMs general):
  # el clustering DBSCAN es una operación pesada y 1500ms sería un falso
  # positivo constante en este endpoint específico.
  # -----------------------------------------------------------------------
  GeospatialFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: emergencias-geospatial
      ImageUri: !Ref GeospatialImageUri
      Role: !Ref GeospatialRoleArn
      Timeout: 30 # el clustering puede tardar más que el resto de rutas
      AutoPublishAlias: prod
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref GeospatialErrorsAlarm
          - !Ref GeospatialLatencyAlarm
      Events:
        Recalcular:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergenciasApi
            Path: /v1/geospatial/recalcular
            Method: POST

  GeospatialErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergencias-geospatial-errors
      AlarmDescription: Errores de Lambda (Service 3) — dispara rollback del canary.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GeospatialFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  GeospatialLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergencias-geospatial-latency
      AlarmDescription: Latencia p99 (Service 3) sobre el umbral — dispara rollback del canary.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref GeospatialFunction
      ExtendedStatistic: p99
      Period: 60
      EvaluationPeriods: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # -----------------------------------------------------------------------
  # Service 4: Notification & Status Broadcast
  # (recibe el Database Webhook de Supabase, ver docs/fase3-gateway-frontend.md)
  # -----------------------------------------------------------------------
  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: emergencias-notification
      ImageUri: !Ref NotificationImageUri
      Role: !Ref NotificationRoleArn
      AutoPublishAlias: prod
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref NotificationErrorsAlarm
          - !Ref NotificationLatencyAlarm
      Events:
        Eventos:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergenciasApi
            Path: /v1/notificaciones/eventos
            Method: POST

  NotificationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergencias-notification-errors
      AlarmDescription: Errores de Lambda (Service 4) — dispara rollback del canary.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificationFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  NotificationLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergencias-notification-latency
      AlarmDescription: Latencia p99 (Service 4) sobre el umbral — dispara rollback del canary.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificationFunction
      ExtendedStatistic: p99
      Period: 60
      EvaluationPeriods: 2
      Threshold: !Ref LatencyThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # -----------------------------------------------------------------------
  # Alarma compartida: 5xx agregados del API Gateway (las 4 DeploymentPreference
  # la referencian). HTTP API v2 publica métricas básicas a AWS/ApiGateway sin
  # configuración adicional.
  # -----------------------------------------------------------------------
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergencias-api-5xx
      AlarmDescription: Errores 5xx agregados del API Gateway — dispara rollback del canary.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref EmergenciasApi
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # -----------------------------------------------------------------------
  # Rate limiting por IP (además del throttling agregado del stage de arriba).
  # HTTP API no soporta Usage Plans/API Keys nativamente (eso es solo REST
  # API) — el patrón estándar de AWS para "por IP" es WAF con una regla
  # rate-based, asociada al stage. Mitiga los picos de tráfico concurrente
  # y ataques de denegación de servicio descritos en el enunciado.
  # -----------------------------------------------------------------------
  ApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: emergencias-api-waf
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: emergencias-api-waf
      Rules:
        - Name: RateLimitPorIp
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPorIpCada5Min
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPorIp

Outputs:
  ApiBaseUrl:
    Description: Endpoint base del API Gateway (stage prod) — usar como VITE_API_BASE_URL en el frontend
    Value: !Sub "https://${EmergenciasApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  IntakeTriageFunctionArn:
    Value: !GetAtt IntakeTriageFunction.Arn
  DispatchFunctionArn:
    Value: !GetAtt DispatchFunction.Arn
  GeospatialFunctionArn:
    Value: !GetAtt GeospatialFunction.Arn
  NotificationFunctionArn:
    Value: !GetAtt NotificationFunction.Arn
